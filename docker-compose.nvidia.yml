services:
  generator:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL_GPU:-https://download.pytorch.org/whl/cu128}
        TORCH_VERSION: ${TORCH_VERSION_GPU:-2.8.0+cu128}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION_GPU:-2.8.0+cu128}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION_GPU:-0.23.0+cu128}
    gpus: all
    environment:
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_THREADS=4
      - WHISPER_BATCH_SIZE=8
      - MDX_BATCH_SIZE=1
      - RELEASE_SEPARATOR_AFTER_ISOLATION=1
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN=${HF_TOKEN:-}

  gigaam:
    build:
      context: ./gigaam_service
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL_GPU:-https://download.pytorch.org/whl/cu128}
        TORCH_VERSION: ${TORCH_VERSION_GPU:-2.8.0+cu128}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION_GPU:-2.8.0+cu128}
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
