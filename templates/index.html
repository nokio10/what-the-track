<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURO PLAYER</title>
    
    <link href="{{ url_for('static', filename='offline-fallback.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- Запасной клиент без интернета. Смена src в onerror не работает: уже
         запущенный <script> повторно не загружается. document.write во время
         разбора страницы подключает локальный клиент синхронно, до DOMContentLoaded. -->
    <script>window.io || document.write('<script src="{{ url_for('static', filename='socketio-lite.js') }}"><\/script>');</script>
    
    <style>
        :root {
            --bg-dark: #0f0c29;
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass-bg: rgba(20, 20, 40, 0.75);
            --glass-border: rgba(167, 139, 250, 0.2);
            --primary-purple: #8b5cf6;
            --primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            --primary-glow: 0 4px 15px rgba(139, 92, 246, 0.4);
            --text-main: #e2e8f0;
            --text-accent: #a78bfa;
            --accent-gold: #fbbf24;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        /* --- RESULT STYLES --- */
        .result-success {
            border: 2px solid var(--success-color);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        .result-fail {
            border: 2px solid var(--danger-color);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .status-success { background: rgba(16, 185, 129, 0.2); color: var(--success-color); }
        .status-fail { background: rgba(239, 68, 68, 0.2); color: var(--danger-color); }

        .sticky-header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(15, 12, 41, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 20px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }

        .game-logo {
            font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;
            background: linear-gradient(to right, #c084fc, #8b5cf6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .game-container {
            max-width: 600px; margin: 0 auto;
            padding-top: 100px; padding-bottom: 50px;
        }

        .hidden { display: none !important; }

        .form-control-custom {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px; color: white; padding: 12px; font-size: 1.1rem; text-align: center;
            text-transform: none;
        }
        .form-control-custom:focus {
            background: rgba(255,255,255,0.1); border-color: #8b5cf6; box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); color: white;
        }
        .form-control-custom::placeholder { color: rgba(255,255,255,0.3); text-transform: none; }
        
        #gameIdInput { text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        #gameIdInput::placeholder { letter-spacing: normal; font-weight: normal; }

        .btn-purple-main {
            background: var(--primary-gradient); border: none; color: white;
            font-weight: 700; border-radius: 14px; padding: 14px; letter-spacing: 0.5px;
            box-shadow: var(--primary-glow); transition: 0.3s;
        }
        .btn-purple-main:active { transform: scale(0.98); }

        .btn-gold-pulse {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none; color: white; font-weight: 800;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            animation: pulse-gold 2s infinite;
            transition: opacity 0.5s ease;
        }
        @keyframes pulse-gold { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); } 
            100% { transform: scale(1); } 
        }

        .lang-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #94a3b8; border-radius: 20px; padding: 4px 12px;
            font-size: 0.75rem; font-weight: 600; cursor: pointer;
        }
        .active-lang { color: #c084fc; font-weight: 800; }

        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(139, 92, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }
        .pulse-icon { animation: pulse-glow 2s infinite; border-radius: 50%; }

        #gameEndOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.98); z-index: 2000;
            padding: 80px 20px 20px 20px; overflow-y: auto; text-align: center;
        }
        .winner-title { font-size: 2.5rem; font-weight: 800; background: linear-gradient(to right, #facc15, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        #timerOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.95); z-index: 2500;
            justify-content: center; align-items: center; flex-direction: column;
            backdrop-filter: blur(10px);
        }
        .timer-count { font-size: 8rem; font-weight: 900; color: white; text-shadow: 0 0 50px #8b5cf6; }
        
        .table-custom { --bs-table-bg: transparent; --bs-table-color: #e2e8f0; }
        .table-custom td, .table-custom th { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .current-player-row { background: rgba(139, 92, 246, 0.2) !important; font-weight: bold; color: white; }

        canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1500; }
    </style>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    
    <div class="sticky-header">
        <div class="game-logo"><i class="fas fa-brain me-2"></i><span data-i18n="gameTitle">NEURO GAME</span></div>
        <button id="langToggle" class="lang-btn">
            <span id="langEn">EN</span> / <span id="langRu">RU</span>
        </button>
    </div>

    <div id="timerOverlay">
        <div class="text-uppercase text-accent mb-3" style="letter-spacing: 2px;" data-i18n="timerLabel">Answer reveal in...</div>
        <div class="timer-count" id="timerValue">3</div>
    </div>

    <div id="gameEndOverlay">
        <div class="container" style="max-width: 600px;">
            <h2 class="mb-2 text-white" data-i18n="gameOver">🏁 GAME OVER 🏁</h2>
            <div id="winnerTextBlock" class="mb-5"></div>
            <div class="glass-card p-0 overflow-hidden">
                <div class="p-3 border-bottom border-light border-opacity-10 bg-black bg-opacity-25">
                    <h5 class="m-0 text-white-50" data-i18n="finalTable">Final Leaderboard</h5>
                </div>
                <div class="p-3">
                    <table class="table table-custom table-sm mb-0">
                        <thead><tr><th>#</th><th data-i18n="thName">Name</th><th class="text-end" data-i18n="thScore">Score</th></tr></thead>
                        <tbody id="finalLeaderboard"></tbody>
                    </table>
                </div>
            </div>
            <button onclick="window.location.reload()" class="btn btn-purple-main w-100 rounded-pill mt-4">
                <i class="fas fa-sign-out-alt me-2"></i> <span data-i18n="btnExit">EXIT GAME</span>
            </button>
        </div>
    </div>

    <div class="container game-container main-game-interface">
        
        <div id="loginBlock" class="glass-card text-center">
            <div class="mb-4">
                <div style="width: 80px; height: 80px; background: var(--primary-gradient); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; box-shadow: var(--primary-glow);">
                    <i class="fas fa-gamepad text-white fs-1"></i>
                </div>
            </div>
            <h3 class="mb-4 fw-bold" data-i18n="loginTitle">Join Game</h3>
            <input type="text" id="usernameInput" class="form-control form-control-custom mb-3" placeholder="Your Name" maxlength="32">
            <button onclick="joinGame()" class="btn btn-purple-main w-100" data-i18n="btnJoin">JOIN</button>
            <div id="loginError" class="text-danger mt-3 small fw-bold"></div>
        </div>

        <div id="waitBlock" class="text-center hidden mt-5">
            <div class="pulse-icon mx-auto mb-4" style="width: 100px; height: 100px; background: rgba(139, 92, 246, 0.1); display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-clock fs-1" style="color: #a78bfa;"></i>
            </div>
            <h3 class="fw-bold" data-i18n="waitingTitle">Waiting for host...</h3>
            <p class="text-accent" data-i18n="waitingSub">Get ready!</p>
        </div>

        <div id="questionBlock" class="glass-card hidden">
            <div class="text-center mb-4">
                <span class="badge bg-primary bg-opacity-25 text-primary border border-primary px-3 py-2 rounded-pill"><span data-i18n="qNum">Question</span> #<span id="qIndex"></span></span>
            </div>
            <h4 class="text-center mb-5 fw-bold" id="questionTextDisplay" style="min-height: 50px; white-space: pre-line;"></h4>
            <div id="questionTrackMetaDisplay" class="text-center text-white-50 small mb-4 hidden"></div>
            <div id="listeningMessage" class="text-center py-3">
                <div class="mb-3">
                    <div class="spinner-grow text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                </div>
                <div class="fw-bold fs-5 text-white" data-i18n="listening">🎧 Listening...</div>
            </div>
            <div id="interactionContainer" class="hidden">
                <input type="text" id="textAnswer" class="form-control form-control-custom mb-3" placeholder="...">
                <button onclick="submitText()" class="btn btn-purple-main w-100 fw-bold" data-i18n="btnSubmit">SEND ANSWER</button>
                <div id="answerError" class="text-danger mt-3 small fw-bold hidden"></div>
            </div>
            <div id="answerStatus" class="text-center mt-3 hidden">
                <span class="badge bg-success px-3 py-2 rounded-pill"><i class="fas fa-check me-2"></i> <span data-i18n="answerSent">Answer Accepted</span></span>
            </div>
        </div>

        <!-- RESULT BLOCK WITH FEEDBACK -->
        <div id="resultBlock" class="hidden">
            <div id="resultCardHeader" class="glass-card p-4 mb-3 text-center" style="border-width: 2px;">
                <!-- Status Badge (Correct/Wrong) -->
                <div id="personalStatus"></div>
                
                <h6 class="text-white-50 text-uppercase mb-2" style="letter-spacing: 1px;" data-i18n="correctLabel">Correct Answer</h6>
                <h3 class="fw-bold mb-0" id="correctAnswerText"></h3>
                <div id="resultTrackMetaDisplay" class="text-white-50 small mt-3 hidden"></div>
            </div>
            
            <h6 class="text-center text-accent text-uppercase mb-3" style="letter-spacing: 1px;" data-i18n="roundTable">Table</h6>
            
            <div class="glass-card p-0 overflow-hidden mb-3">
                <div class="p-3">
                    <table class="table table-custom table-sm mb-0">
                        <thead><tr><th>#</th><th data-i18n="thName">Name</th><th class="text-end" data-i18n="thScore">Pts</th></tr></thead>
                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>
            </div>

            <button id="vipNextBtn" onclick="requestNextQuestion()" class="btn btn-gold-pulse w-100 rounded-pill py-3 hidden">
                <span data-i18n="btnNextVip">NEXT QUESTION</span> <i class="fas fa-forward ms-2"></i>
            </button>
        </div>
    </div>

    <script>
        function showDependencyError(message) {
            let banner = document.getElementById('dependencyErrorBanner');
            if (!banner) {
                banner = document.createElement('div');
                banner.id = 'dependencyErrorBanner';
                banner.className = 'offline-error-banner';
                document.body.appendChild(banner);
            }
            banner.textContent = message;
        }

        const i18n = {
            en: {
                gameTitle: "NEURO GAME",
                timerLabel: "REVEALING...",
                gameOver: "🏁 GAME OVER 🏁",
                finalTable: "Final Leaderboard",
                btnExit: "EXIT GAME",
                loginTitle: "Join Game",
                btnJoin: "JOIN",
                waitingTitle: "Waiting for host...",
                waitingSub: "Get ready!",
                qNum: "Question",
                listening: "🎧 Listening...",
                btnSubmit: "SEND ANSWER",
                answerSent: "Answer Accepted",
                correctLabel: "CORRECT ANSWER",
                roundTable: "LEADERBOARD",
                thName: "Name",
                thScore: "Pts",
                winnerYou: "🏆 YOU WON! 🏆",
                yourScore: "Your Score",
                winners: "Winners",
                noWinners: "No winners",
                placeholderId: "GAME ID (e.g. ABCD)",
                placeholderName: "Your Name",
                placeholderAns: "Your answer...",
                btnNextVip: "NEXT QUESTION",
                statusCorrect: "✅ CORRECT! +2 PTS",
                statusWrong: "❌ WRONG",
                shortAnswerError: "Min 4 characters",
                whisperMetaLabel: "Whisper Track"
            },
            ru: {
                gameTitle: "НЕЙРО ИГРА",
                timerLabel: "ВСКРЫВАЕМ...",
                gameOver: "🏁 ИГРА ОКОНЧЕНА 🏁",
                finalTable: "Итоговая таблица",
                btnExit: "ВЫЙТИ",
                loginTitle: "Вход в игру",
                btnJoin: "ВОЙТИ",
                waitingTitle: "Ожидание ведущего...",
                waitingSub: "Приготовьтесь!",
                qNum: "Вопрос",
                listening: "🎧 Слушаем трек...",
                btnSubmit: "ОТПРАВИТЬ",
                answerSent: "Ответ принят",
                correctLabel: "ПРАВИЛЬНЫЙ ОТВЕТ",
                roundTable: "ТАБЛИЦА",
                thName: "Имя",
                thScore: "Очки",
                winnerYou: "🏆 ВЫ ПОБЕДИЛИ! 🏆",
                yourScore: "Ваш счет",
                winners: "Победители",
                noWinners: "Победителей нет",
                placeholderId: "КОД ИГРЫ (4 буквы)",
                placeholderName: "Ваше имя",
                placeholderAns: "Ваш ответ...",
                btnNextVip: "СЛЕДУЮЩИЙ ВОПРОС",
                statusCorrect: "✅ ВЕРНО! +2 БАЛЛА",
                statusWrong: "❌ НЕВЕРНО",
                shortAnswerError: "Минимум 4 символа",
                whisperMetaLabel: "Whisper-трек"
            }
        };

        let currentLang = localStorage.getItem('neuroPlayerLang') || 'en';
        function t(key) { return i18n[currentLang][key] || key; }

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerText = t(el.dataset.i18n);
            });
            const enSpan = document.getElementById('langEn');
            const ruSpan = document.getElementById('langRu');
            if (currentLang === 'en') {
                enSpan.classList.add('active-lang'); ruSpan.classList.remove('active-lang');
            } else {
                enSpan.classList.remove('active-lang'); ruSpan.classList.add('active-lang');
            }
            localStorage.setItem('neuroPlayerLang', currentLang);
            document.getElementById('usernameInput').placeholder = t('placeholderName');
            document.getElementById('textAnswer').placeholder = t('placeholderAns');
        }

        function normalizeAnswerForValidation(text) {
            return (text || '')
                .toLowerCase()
                .replace(/ё/g, 'е')
                .replace(/[^\wа-яё]/gi, '');
        }

        function setAnswerError(message) {
            const errorEl = document.getElementById('answerError');
            errorEl.innerText = message || '';
            errorEl.classList.toggle('hidden', !message);
        }

        function renderTrackMeta(trackMeta) {
            const text = trackMeta ? `${t('whisperMetaLabel')}: ${trackMeta}` : '';
            const questionMetaEl = document.getElementById('questionTrackMetaDisplay');
            const resultMetaEl = document.getElementById('resultTrackMetaDisplay');

            questionMetaEl.innerText = text;
            questionMetaEl.classList.toggle('hidden', !text);

            resultMetaEl.innerText = text;
            resultMetaEl.classList.toggle('hidden', !text);
        }

        // Имена и id приходят от игроков — в innerHTML только через escapeHtml.
        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        // Постоянный id браузера: по нему сервер узнаёт переподключение и не даёт
        // второму игроку с тем же именем выкинуть первого.
        function getPlayerId() {
            const fresh = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
            try {
                let id = localStorage.getItem('music_game_player_id');
                if (!id) {
                    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : fresh();
                    localStorage.setItem('music_game_player_id', id);
                }
                return id;
            } catch (e) {
                window.__musicGamePlayerId = window.__musicGamePlayerId || fresh();
                return window.__musicGamePlayerId;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof io !== 'function') {
                showDependencyError('Local realtime client did not load. Verify that /static/socketio-lite.js is reachable through nginx on port 5002.');
                return;
            }

            // Настройка WebSocket с автоматическим переподключением
            const socket = io({
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: Infinity,
                timeout: 20000,
                transports: ['websocket', 'polling']  // Используем оба транспорта для надежности
            });

            applyLanguage();
            let amIVip = false;
            let isLastRound = false;
            let hasJoined = false;
            let myPlayerName = '';

            document.getElementById('langToggle').addEventListener('click', () => {
                currentLang = currentLang === 'en' ? 'ru' : 'en';
                applyLanguage();
            });

            // localStorage может быть недоступен (строгий приватный режим) — вход
            // не должен от этого ломаться.
            const rememberName = (value) => { try { localStorage.setItem('music_game_name', value); } catch (e) {} };
            let myName = '';
            try { myName = localStorage.getItem('music_game_name') || ''; } catch (e) {}
            if (myName) document.getElementById('usernameInput').value = myName;

            window.joinGame = function() {
                const name = document.getElementById('usernameInput').value.trim();
                if(!name) return;
                myPlayerName = name;
                myName = name;
                hasJoined = true;
                rememberName(name);
                socket.emit('join_game', {name: name, player_id: getPlayerId()});
            }

            // Автоматическое переподключение при разрыве
            socket.on('disconnect', (reason) => {
                console.log('Disconnected:', reason);
                document.getElementById('loginError').innerText = currentLang === 'en' ? 'Connection lost...' : 'Соединение потеряно...';
            });

            socket.on('connect_error', (error) => {
                console.error('Connection error:', error);
                document.getElementById('loginError').innerText = currentLang === 'en' ? 'Connection error!' : 'Ошибка подключения!';
            });

            // Повторный вход делает обработчик 'connect' — он срабатывает и после
            // переподключения. Здесь только сброс сообщения, иначе вход уходил дважды.
            socket.on('reconnect', (attemptNumber) => {
                console.log('Reconnected after', attemptNumber, 'attempts');
                document.getElementById('loginError').innerText = '';
            });

            socket.on('connect', () => {
                console.log('Connected to server');
                document.getElementById('loginError').innerText = '';
                if (hasJoined && myPlayerName) {
                    socket.emit('join_game', {name: myPlayerName, player_id: getPlayerId()});
                }
            });

            // Отказ может прийти и на автоматический вход после переподключения,
            // когда экран входа скрыт: показываем его вместе с причиной.
            socket.on('join_error', (d) => {
                hasJoined = false;
                showScreen('loginBlock');
                document.getElementById('loginError').innerText = d.msg;
            });
            socket.on('join_success', (d) => {
                // Сервер мог обрезать имя — сравниваем себя с таблицей по его версии.
                if (d && d.name) {
                    myName = d.name;
                    myPlayerName = d.name;
                    rememberName(d.name);
                }
                showScreen('waitBlock');
            });

            socket.on('game_status', (d) => {
                if (d.state === 'question' || d.state === 'answer') {
                    if (d.question_data) {
                        document.getElementById('qIndex').innerText = d.question_data.index;
                        document.getElementById('questionTextDisplay').innerText = d.question_data.question || '';
                        renderTrackMeta(d.question_data.track_meta || '');
                    }
                    showScreen('questionBlock');
                    if (d.inputs_enabled) {
                        document.getElementById('listeningMessage').classList.add('hidden');
                        document.getElementById('interactionContainer').classList.remove('hidden');
                    } else {
                        document.getElementById('listeningMessage').classList.remove('hidden');
                        document.getElementById('interactionContainer').classList.add('hidden');
                    }
                } else if (d.state === 'finished') {
                    showScreen('resultBlock');
                }
            });

            socket.on('game_reset', () => window.location.reload());

            socket.on('new_question', (d) => {
                showScreen('questionBlock');
                document.getElementById('timerOverlay').style.display = 'none';
                document.getElementById('qIndex').innerText = d.index;
                document.getElementById('questionTextDisplay').innerText = d.question || "";
                renderTrackMeta(d.track_meta || '');
                
                document.getElementById('answerStatus').classList.add('hidden');
                setAnswerError('');
                document.getElementById('listeningMessage').classList.remove('hidden');
                document.getElementById('interactionContainer').classList.add('hidden');
                document.getElementById('textAnswer').value = '';
                document.getElementById('textAnswer').disabled = false;
                document.getElementById('vipNextBtn').classList.add('hidden');
                
                const card = document.getElementById('resultCardHeader');
                card.classList.remove('result-success', 'result-fail');
            });

            socket.on('allow_answers', () => {
                document.getElementById('listeningMessage').classList.add('hidden');
                document.getElementById('interactionContainer').classList.remove('hidden');
                setAnswerError('');
            });

            socket.on('start_timer', (d) => {
                const overlay = document.getElementById('timerOverlay');
                const val = document.getElementById('timerValue');
                let tm = d.seconds;
                overlay.style.display = 'flex';
                val.innerText = tm;
                const i = setInterval(() => { tm--; val.innerText = tm; if(tm<=0) clearInterval(i); }, 1000);
            });

            socket.on('show_answer_client', (d) => {
                document.getElementById('timerOverlay').style.display = 'none';
                showScreen('resultBlock');
                document.getElementById('correctAnswerText').innerText = d.answer;
                renderTrackMeta(d.track_meta || '');

                // Используем my_delta вместо deltas[myName] для надежности
                const card = document.getElementById('resultCardHeader');
                const statusDiv = document.getElementById('personalStatus');
                const earned = d.my_delta || 0;

                if (earned > 0) {
                    card.classList.remove('result-fail');
                    card.classList.add('result-success');
                    statusDiv.innerHTML = `<div class="status-badge status-success" data-i18n="statusCorrect">${t('statusCorrect')}</div>`;
                } else {
                    card.classList.remove('result-success');
                    card.classList.add('result-fail');
                    statusDiv.innerHTML = `<div class="status-badge status-fail" data-i18n="statusWrong">${t('statusWrong')}</div>`;
                }

                const tbody = document.getElementById('leaderboardBody');
                tbody.innerHTML = '';
                d.leaderboard.forEach((p, i) => {
                    let cls = (p.name === myName) ? 'current-player-row' : '';
                    tbody.innerHTML += `<tr class="${cls}"><td>${i+1}</td><td>${escapeHtml(p.name)}</td><td class="text-end">${escapeHtml(p.score)}</td></tr>`;
                });

                amIVip = (d.vip_id === socket.id);
                isLastRound = d.is_last;
                document.getElementById('vipNextBtn').classList.add('hidden');
            });

            socket.on('allow_next_question', (d) => {
                // VIP мог смениться после показа ответа: сервер присылает текущего.
                if (d && d.vip_id) amIVip = (d.vip_id === socket.id);
                if (amIVip && !isLastRound) {
                    const btn = document.getElementById('vipNextBtn');
                    btn.classList.remove('hidden');
                    btn.style.opacity = 0;
                    setTimeout(() => btn.style.opacity = 1, 100);
                }
            });

            socket.on('answer_validation_error', (d) => {
                setAnswerError(d.msg || t('shortAnswerError'));
                document.getElementById('textAnswer').disabled = false;
                document.getElementById('interactionContainer').classList.remove('hidden');
                document.getElementById('answerStatus').classList.add('hidden');
            });

            window.requestNextQuestion = function() {
                socket.emit('player_next_question');
                document.getElementById('vipNextBtn').classList.add('hidden'); 
            };

            socket.on('game_over', (d) => {
                document.querySelector('.main-game-interface').style.display = 'none';
                document.getElementById('gameEndOverlay').style.display = 'block';
                const wins = d.winners || [];
                const txt = document.getElementById('winnerTextBlock');
                if(wins.some(w => w.name === myName)) {
                    txt.innerHTML = `<div class="winner-title mb-2">${t('winnerYou')}</div>`;
                    startFireworks();
                } else {
                    const names = wins.map(w=>escapeHtml(w.name)).join(', ');
                    txt.innerHTML = `<h3 class="text-white-50">${t('winners')}: <span class="text-accent">${names}</span></h3>`;
                }
                const tbody = document.getElementById('finalLeaderboard');
                tbody.innerHTML = d.leaderboard.map((p,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(p.name)}</td><td class="text-end">${escapeHtml(p.score)}</td></tr>`).join('');
            });

            window.submitText = function() {
                const val = document.getElementById('textAnswer').value;
                if (!val) {
                    return;
                }
                if (normalizeAnswerForValidation(val).length < 4) {
                    setAnswerError(t('shortAnswerError'));
                    return;
                }
                setAnswerError('');
                if(val) {
                    socket.emit('submit_answer', {answer: val});
                    document.getElementById('textAnswer').disabled = true;
                    document.getElementById('answerStatus').classList.remove('hidden');
                    document.getElementById('interactionContainer').classList.add('hidden');
                }
            }

            function showScreen(id) {
                ['loginBlock','waitBlock','questionBlock','resultBlock'].forEach(x => document.getElementById(x).classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
            }

            function startFireworks() {
                const c = document.getElementById('fireworksCanvas');
                const ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                let parts = [];
                function P(x,y,col) { this.x=x; this.y=y; this.col=col; this.v={x:(Math.random()-.5)*8, y:(Math.random()-.5)*8}; this.a=1; }
                P.prototype.draw = function() { ctx.globalAlpha=this.a; ctx.fillStyle=this.col; ctx.beginPath(); ctx.arc(this.x,this.y,4,0,Math.PI*2); ctx.fill(); };
                P.prototype.upd = function() { this.v.x*=.96; this.v.y*=.96; this.x+=this.v.x; this.y+=this.v.y; this.a-=.01; };
                function anim() {
                    requestAnimationFrame(anim);
                    ctx.clearRect(0,0,c.width,c.height);
                    parts.forEach((p,i)=>{ if(p.a>0){p.upd();p.draw();}else parts.splice(i,1); });
                }
                setInterval(()=>{
                    const x=Math.random()*c.width, y=Math.random()*c.height/2, col=`hsl(${Math.random()*360},50%,50%)`;
                    for(let i=0;i<30;i++) parts.push(new P(x,y,col));
                },800);
                anim();
            }
        });
    </script>
</body>
</html>
