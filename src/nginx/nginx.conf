map $http_upgrade $connection_upgrade {
    default Upgrade;
    '' close;
}

server {
    listen 80;
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Файлы вопросов и журналы с ответами игрокам не нужны: клиенты берут из
    # /media только mp3. Без этого правила любой игрок читал ответы по прямой
    # ссылке. Регулярный location важнее префиксного /media/.
    location ~* ^/media/.*\.(json|jsonl)$ {
        return 404;
    }

    location /media/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Access-Control-Allow-Origin *;
    }

    location /socket.io/ {
        set $game_app_socketio http://game-app:5000;
        proxy_pass $game_app_socketio$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличенные таймауты для стабильности через облачный доступ Keenetic
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Отключаем кэширование для WebSocket
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        set $game_app_http http://game-app:5000;
        proxy_pass $game_app_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
